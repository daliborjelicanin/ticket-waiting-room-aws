# Minimal CI for slice 0 (D14): the checks a ruleset on main can require. No AWS credentials
# here and no OIDC; slice 4 adds images.yml and terraform.yml with their roles.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: gradle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only launches Gradle; the build's JDK 26 toolchain is provisioned by foojay.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test
        run: ./gradlew build

  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Terraform version
        id: tf
        run: echo "version=$(cat ../.terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: validate every root and module
        run: |
          set -euo pipefail
          for dir in $(find . -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u); do
            echo "::group::$dir"
            # Roots commit their lock file and must match it; modules have none (the root pins).
            lock=(); [ -f "$dir/.terraform.lock.hcl" ] && lock=(-lockfile=readonly)
            terraform -chdir="$dir" init -backend=false -input=false "${lock[@]}"
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"
