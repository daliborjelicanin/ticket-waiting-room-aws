# CI (D2, D14): the checks the ruleset on main requires — Gradle, the Terraform gates (fmt,
# validate, terraform test, tflint, trivy) and the workflows' own lint. No AWS credentials here
# and no OIDC: the workflows that assume a role (images.yml, and the rest of slice 4) are separate.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: gradle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only launches Gradle; the build's JDK 26 toolchain is provisioned by foojay.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test
        run: ./gradlew build

  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Terraform version
        id: tf
        run: echo "version=$(cat ../.terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      # Roots only: a root validates every module it calls, with the providers it passes in.
      # A module validated on its own cannot receive an aliased provider (modules/audit takes
      # aws.us_east_1), so it fails for a reason that is not a defect.
      - name: validate every root
        run: |
          set -euo pipefail
          for dir in $(find . -name 'providers.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u); do
            echo "::group::$dir"
            # Roots commit their lock file and must match it; modules have none (the root pins).
            lock=(); [ -f "$dir/.terraform.lock.hcl" ] && lock=(-lockfile=readonly)
            terraform -chdir="$dir" init -backend=false -input=false "${lock[@]}"
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      # Module tests (D2): plan against a mocked provider, so no credentials and no cost. They
      # pin the retro's silent defaults (TTL, raw delivery, ReportBatchItemFailures, the KMS
      # producer grants). A module is initialised on its own only to load the provider schema.
      - name: terraform test
        run: |
          set -euo pipefail
          for dir in $(find modules -name '*.tftest.hcl' -printf '%h\n' | xargs -n1 dirname | sort -u); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"
      # IaC misconfiguration scan (D2). The image is pinned by digest, not tag: in March 2026
      # trivy's release tags were repointed at malicious builds. Accepted findings live in
      # .trivyignore.yaml, each with the decision it implements.
      - name: trivy config
        run: |
          docker run --rm -v "$PWD":/src:ro -w /src \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            config --quiet --exit-code 1 --ignorefile .trivyignore.yaml .

  # The workflows themselves (D14): expressions, contexts, job wiring and, through its bundled
  # shellcheck, every run: script. A mistake here otherwise surfaces as a failed deploy on main.
  # Pinned by digest, like trivy.
  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm -v "$PWD":/repo:ro -w /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -no-color
