# CI (D2, D14): the checks the ruleset on main requires — Gradle, the Terraform gates (fmt,
# validate, terraform test, tflint, trivy) and the workflows' own lint. No AWS credentials here
# and no OIDC: the workflows that assume a role (images.yml, terraform.yml, the rest of slice 4)
# are separate.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: gradle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only launches Gradle; the build's JDK 26 toolchain is provisioned by foojay.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test
        run: ./gradlew build

  # The Terraform gates live in one composite action, shared with terraform.yml's pre-apply run.
  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform-gates

  # The workflows themselves (D14): expressions, contexts, job wiring and, through its bundled
  # shellcheck, every run: script. A mistake here otherwise surfaces as a failed deploy on main.
  # Pinned by digest, like trivy.
  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm -v "$PWD":/repo:ro -w /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -no-color
