# Dependency updates (D2). Weekly and grouped, so updates arrive as a few PRs rather than many.
# The cooldown waits a week after a release before proposing it: most compromised releases are
# caught and pulled within days.
version: 2
updates:
  - package-ecosystem: terraform
    directories:
      - /infra/org
      - /infra/bootstrap
      - /infra/live/*
      - /infra/modules/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /*-service
      - /*-lambda
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
