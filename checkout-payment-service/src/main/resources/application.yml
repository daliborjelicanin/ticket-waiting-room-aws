spring:
  application:
    name: checkout-payment-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # The Cognito user pool's issuer, e.g.
          #   https://cognito-idp.eu-central-1.amazonaws.com/eu-central-1_XXXXXXXXX
          # Required: security-starter refuses to start the service without one, by name --
          # an identity-checking service with no identity provider is misconfigured, not
          # degraded. Locally this points at the real pool: JWKS is a public GET, no
          # credentials, and the pool is free.
          issuer-uri: ${COGNITO_ISSUER_URI:}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/checkout}
    username: ${DB_USERNAME:checkout}
    password: ${DB_PASSWORD:checkout}
  jpa:
    hibernate:
      # Flyway owns the schema. `validate` turns a drifted entity mapping into a startup
      # failure instead of a silent ALTER against a production table.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

checkout:
  currency: EUR

payment-gateway:
  # Chaos knobs for load testing. Both default to 0 so behaviour is deterministic unless
  # asked otherwise; the tok_decline / tok_error tokens drive the deterministic paths.
  decline-rate: 0.0
  error-rate: 0.0
  latency: PT0S

management:
  endpoints:
    web:
      exposure:
        # Health and nothing else: the ALB's probe. Metrics leave over OTLP, not over HTTP.
        include: health
  endpoint:
    health:
      # A status word, no components: this is anonymous, and the ALB only reads the code.
      show-details: never
  tracing:
    sampling:
      # Every request, for now. The load test is the point of slice 7 and X-Ray at 10%
      # would show a tenth of it; revisit once the traffic is real rather than staged.
      probability: 1.0
    export:
      otlp:
        enabled: ${TELEMETRY_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        # One switch for both signals. Off locally, so a service with no collector beside it
        # does not log a failed export every minute; on in ECS, where the endpoint is the
        # ADOT collector sidecar on the task's loopback, which forwards to X-Ray and CloudWatch.
        enabled: ${TELEMETRY_EXPORT_ENABLED:false}
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: PT1M
  metrics:
    tags:
      # Every data point carries the service name as an attribute, which the collector's
      # EMF exporter turns into a CloudWatch dimension. Without it five services' copies of
      # http.server.requests land in one namespace as one indistinguishable metric —
      # OTLP's resource attributes (where service.name otherwise lives) are not dimensions.
      service: ${spring.application.name}
    enable:
      # Every exported series is a billable CloudWatch metric. Boot's JVM, Tomcat, logging
      # and process meters are dozens of them and answer none of the dashboard's questions;
      # the request timer and this service's own meters are what the dashboard reads.
      all: false
      http.server.requests: true
      checkout: true
