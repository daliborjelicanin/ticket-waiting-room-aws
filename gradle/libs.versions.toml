[versions]
springBoot = "4.1.1"
awsSdk = "2.46.21"
awsLambdaCore = "1.4.0"
awsLambdaRic = "2.8.3"
awsLambdaEvents = "3.16.1"
junit = "6.1.1"
testcontainers = "2.0.5"
assertj = "3.27.7"
mockito = "5.20.0"
lombok = "1.18.38"
zxing = "3.5.3"
# Both compiled against OpenTelemetry 1.62.0, the version Boot 4.1.0's BOM manages. Bumping
# one without the other leaves a mixed OTel API/SDK on the classpath -- check the artifact's
# pom for the opentelemetry-api version it declares before moving either.
otelAwsXray = "1.57.0-alpha"
otelInstrumentation = "2.28.0-alpha"
tomcatSecurityFloor = "11.0.25"
jacksonSecurityFloor = "3.1.7"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis", version.ref = "springBoot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "springBoot" }
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway", version.ref = "springBoot" }
# Every HTTP service is an OAuth2 resource server: it verifies the caller's JWT against the Cognito user pool itself,
# rather than trusting a header the edge injected. SeeTicketingScopes in common for the one string Cognito and the services must agree on.
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server", version.ref = "springBoot" }
# Health endpoint only; metrics arrive through the OpenTelemetry starter below.
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "springBoot" }
# OTLP export for traces AND metrics. Boot 4 dropped its CloudWatch metrics auto-configuration
# (the Micrometer registry moved to Spring Cloud AWS), and OTLP into a collector sidecar is
# the one path that lands in both X-Ray and CloudWatch without an AWS SDK in the pipeline.
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry", version.ref = "springBoot" }
spring-boot-starter-opentelemetry-test = { module = "org.springframework.boot:spring-boot-starter-opentelemetry-test", version.ref = "springBoot" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test", version.ref = "springBoot" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test", version.ref = "springBoot" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
# The X-Ray trace header (X-Amzn-Trace-Id) as an OTel propagator: what API Gateway, ALB and
# the SQS AWSTraceHeader attribute carry. The propagator artifact alone -- the full
# opentelemetry-aws-xray brings okhttp, Jackson 2 and Caffeine for a remote sampler nobody
# here uses; the trace-id generator it would also supply is twenty lines, written locally.
opentelemetry-aws-xray-propagator = { module = "io.opentelemetry.contrib:opentelemetry-aws-xray-propagator", version.ref = "otelAwsXray" }
# ExecutionInterceptor for AWS SDK v2 clients: a span per DynamoDB/SQS/S3/SES call, and the
# trace header injected into outgoing SQS messages so a consumer can continue the trace.
opentelemetry-aws-sdk = { module = "io.opentelemetry.instrumentation:opentelemetry-aws-sdk-2.2", version.ref = "otelInstrumentation" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }
# The OTLP exporter's HTTP sender on java.net.http instead of its default OkHttp -- which
# brings OkHttp, Okio and the Kotlin standard library into every service image for one
# POST a minute to localhost.
opentelemetry-exporter-sender-jdk = { module = "io.opentelemetry:opentelemetry-exporter-sender-jdk" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awsSdk" }
aws-sdk-dynamodb = { module = "software.amazon.awssdk:dynamodb" }
aws-sdk-sqs = { module = "software.amazon.awssdk:sqs" }
aws-sdk-s3 = { module = "software.amazon.awssdk:s3" }
aws-sdk-sesv2 = { module = "software.amazon.awssdk:sesv2" }
# The @connections half of a WebSocket API: postToConnection is the only way a server
# initiates a frame, and it lives in its own artifact rather than in apigatewayv2.
aws-sdk-apigatewaymanagementapi = { module = "software.amazon.awssdk:apigatewaymanagementapi" }
aws-sdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client" }
# Already on every AWS SDK classpath as a transitive of the service clients, which use it to
# read their own JSON wire protocol. Declared explicitly because queue-socket-lambda calls
# JsonWriter directly to build its outbound frame, and a direct call on an undeclared
# transitive is one dependency bump away from not compiling.
aws-sdk-json-utils = { module = "software.amazon.awssdk:json-utils" }
aws-lambda-core = { module = "com.amazonaws:aws-lambda-java-core", version.ref = "awsLambdaCore" }
aws-lambda-ric = { module = "com.amazonaws:aws-lambda-java-runtime-interface-client", version.ref = "awsLambdaRic" }
aws-lambda-events = { module = "com.amazonaws:aws-lambda-java-events", version.ref = "awsLambdaEvents" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-localstack = { module = "org.testcontainers:testcontainers-localstack" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
# core only, never javase: MatrixToImageWriter is a dozen lines of BufferedImage/ImageIO,
# and javase pulls jai-imageio-core into a Lambda image that pays for every class it loads.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# Test-only: BufferedImageLuminanceSource is what lets a test decode the PNG it just
# rendered. Never a runtime dependency of the Lambda — that is the whole point.
zxing-javase = { module = "com.google.zxing:javase", version.ref = "zxing" }

[bundles]
testing = ["junit-jupiter", "assertj-core", "mockito-core"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
