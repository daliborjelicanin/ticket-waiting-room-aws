spring:
  application:
    name: waiting-room-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # The Cognito user pool's issuer, e.g.
          #   https://cognito-idp.eu-central-1.amazonaws.com/eu-central-1_XXXXXXXXX
          # Required: security-starter refuses to start the service without one, by name --
          # an identity-checking service with no identity provider is misconfigured, not
          # degraded. Locally this points at the real pool: JWKS is a public GET, no
          # credentials, and the pool is free.
          issuer-uri: ${COGNITO_ISSUER_URI:}
  data:
    redis:
      # Local default; in ECS these point at the ElastiCache primary endpoint.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        # Must be true when the ElastiCache cluster has encryption in transit
        # enabled, or Lettuce fails with an opaque connection timeout rather than
        # a TLS error. No truststore work is needed: ElastiCache certificates
        # chain to Amazon Root CA, which the Temurin image already trusts.
        enabled: ${REDIS_SSL:false}

waiting-room:
  # How long an admitted token may shop before its slot is forfeit and reclaimed.
  admission-duration: PT10M
  max-admit-batch: 500
  # Idle lifetime of an event's queue keys, refreshed on every join and admit.
  key-ttl: PT24H
  # Empty -> admissions are logged instead of published, so the service runs locally with
  # no AWS at all. Set to the queue-admissions URL in ECS, where the WebSocket notifier
  # Lambda is what turns these into pushed frames.
  admission-queue-url: ${ADMISSION_QUEUE_URL:}
  # How often the queue-depth and admitted gauges re-read ZCARD for each known event: two
  # O(1) reads per event per tick. Half the metrics export step, so every export is fresh.
  queue-depth-refresh: PT30S

aws:
  region: ${AWS_REGION:eu-central-1}
  sqs:
    # Empty -> use the real AWS endpoint + default credentials provider chain.
    # Set (e.g. http://localhost:4566) to point at LocalStack for local runs.
    endpoint: ${AWS_SQS_ENDPOINT:}

management:
  endpoints:
    web:
      exposure:
        # Health and nothing else: the ALB's probe. Metrics leave over OTLP, not over HTTP.
        include: health
  endpoint:
    health:
      # A status word, no components: this is anonymous, and the ALB only reads the code.
      show-details: never
  tracing:
    sampling:
      # Every request, for now. The load test is the point of slice 7 and X-Ray at 10%
      # would show a tenth of it; revisit once the traffic is real rather than staged.
      probability: 1.0
    export:
      otlp:
        enabled: ${TELEMETRY_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        # One switch for both signals. Off locally, so a service with no collector beside it
        # does not log a failed export every minute; on in ECS, where the endpoint is the
        # ADOT collector sidecar on the task's loopback, which forwards to X-Ray and CloudWatch.
        enabled: ${TELEMETRY_EXPORT_ENABLED:false}
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: PT1M
  metrics:
    distribution:
      slo:
        # Bucket boundaries for the timers, so they leave as histograms and CloudWatch can
        # answer p50/p95/p99 rather than only avg/max. Ten fixed buckets rather than
        # Micrometer's percentile histogram (~70 per timer): every bucket is a value in the
        # EMF event, and the load test's percentiles do not need finer than this.
        http.server.requests: 10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
    tags:
      # Every data point carries the service name as an attribute, which the collector's
      # EMF exporter turns into a CloudWatch dimension. Without it five services' copies of
      # http.server.requests land in one namespace as one indistinguishable metric —
      # OTLP's resource attributes (where service.name otherwise lives) are not dimensions.
      service: ${spring.application.name}
    enable:
      # Every exported series is a billable CloudWatch metric. Boot's JVM, Tomcat, logging
      # and process meters are dozens of them and answer none of the dashboard's questions;
      # the request timer and this service's own meters are what the dashboard reads.
      all: false
      http.server.requests: true
      waiting_room: true
