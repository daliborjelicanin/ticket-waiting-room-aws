# ADOT collector configuration for every Fargate service's sidecar. Stored in SSM as
# /ticket-waiting-room/otel-collector-config and read by the collector from the
# AOT_CONFIG_CONTENT environment variable at task start. See runbook-observability.md §1.
extensions:
  health_check:

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch/traces:
    timeout: 1s
    send_batch_size: 50
  batch/metrics:
    timeout: 60s

exporters:
  awsxray:
  awsemf:
    namespace: TicketWaitingRoom
    log_group_name: /ticket-waiting-room/metrics
    log_stream_name: otel-collector
    dimension_rollup_option: NoDimensionRollup
    # Cumulative counters (Micrometer's default) are converted to per-step deltas here, and
    # by default the first observation is swallowed as the baseline -- a 20-way race whose
    # increments all land in one step then exports as 0. Keep that first value.
    retain_initial_value_of_delta_metric: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch/traces]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [batch/metrics]
      exporters: [awsemf]
